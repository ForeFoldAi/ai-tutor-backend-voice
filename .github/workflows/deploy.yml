name: Deploy

on:
  pull_request:
    branches: [server]
  push:
    branches: [server]

env:
  IMAGE: ghcr.io/forefoldai/ai-tutor-backend-voice

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/server'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Require Coolify secrets
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
        run: |
          test -n "$COOLIFY_URL" || { echo "Missing secret COOLIFY_URL"; exit 1; }
          test -n "$COOLIFY_TOKEN" || { echo "Missing secret COOLIFY_TOKEN"; exit 1; }
          test -n "$COOLIFY_APP_UUID" || { echo "Missing secret COOLIFY_APP_UUID"; exit 1; }
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Deploy to Coolify
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
        run: |
          resp=$(curl -fsS -X POST "${COOLIFY_URL}/api/v1/deploy" \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -d "{\"uuid\":\"${COOLIFY_APP_UUID}\",\"force\":false}")
          dep=$(echo "$resp" | jq -r '.deployments[0].deployment_uuid // empty')
          test -n "$dep" || { echo "No deployment id from Coolify: $resp"; exit 1; }
          # 60 x 15s = 15 min max
          for i in $(seq 1 60); do
            status=$(curl -fsS "${COOLIFY_URL}/api/v1/deployments/${dep}" \
              -H "Authorization: Bearer ${COOLIFY_TOKEN}" -H "Accept: application/json" \
              | jq -r '.status')
            echo "Voice: ${status}"
            case "$status" in
              finished) exit 0 ;;
              failed|cancelled*) echo "Deployment ${status} - check Coolify logs"; exit 1 ;;
            esac
            sleep 15
          done
          echo "Deployment timed out"; exit 1
